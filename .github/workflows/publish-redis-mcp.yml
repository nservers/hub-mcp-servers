name: Build & Publish redis-mcp

on:
  push:
    branches: [ "main" ]
    paths:
      - 'redis-mcp/**'
      - '.github/workflows/publish-redis-mcp.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./redis-mcp
          file: ./redis-mcp/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hub-mcp-redis:latest
            ghcr.io/${{ github.repository_owner }}/hub-mcp-redis:1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
